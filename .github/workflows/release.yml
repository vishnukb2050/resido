name: Release (terraform → migrate → build → deploy)

# Full release orchestrator. Stages run in order:
#
#   1. terraform-apply.yml — VPC, RDS, Redis, ECS, Secrets (optional)
#   2. db-migrate.yml      — prisma migrate deploy (builds 3 migration images first)
#   3. build-and-push.yml  — build ALL service images → ECR
#   4. deploy.yml          — rolling ECS deploy
#
# First-time bootstrap: run_terraform=true, run_migrate=true, services=all.
# Normal code release:   run_terraform=false, run_migrate=true (or false if no schema change).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: prod
        options: [dev, prod]
      image_tag:
        description: "Image tag for the whole release (defaults to commit SHA)"
        type: string
        required: false
        default: ""
      services:
        description: 'Services to build & deploy: "all" or comma-separated'
        type: string
        required: false
        default: all
      run_terraform:
        description: Run Terraform apply before migrate (first deploy or infra change)
        type: boolean
        required: true
        default: false
      run_migrate:
        description: Run DB migrations after infra (before full build)
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  prepare:
    name: resolve release tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set.outputs.image_tag }}
    steps:
      - id: set
        run: |
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_SHA::7}"; fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

  terraform:
    name: terraform
    needs: prepare
    if: ${{ inputs.run_terraform }}
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  migrate:
    name: db migrate
    needs: [prepare, terraform]
    if: >-
      ${{ inputs.run_migrate
          && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') }}
    uses: ./.github/workflows/db-migrate.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}
    secrets: inherit

  build:
    name: build & push
    needs: [prepare, terraform, migrate]
    if: >-
      ${{ (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
          && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    uses: ./.github/workflows/build-and-push.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      services: ${{ inputs.services }}
    secrets: inherit

  deploy:
    name: deploy
    needs: [prepare, terraform, migrate, build]
    if: >-
      ${{ needs.build.result == 'success'
          && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
          && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      services: ${{ inputs.services }}
    secrets: inherit
