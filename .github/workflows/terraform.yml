name: Terraform · Plan (ECS infra)

# Preview infra changes only — does not create or modify AWS resources.
# To apply: Actions → "Terraform · Apply (ECS infra)" → Run workflow → dev or prod.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (matches envs/<env>.tfvars)
        type: choice
        required: true
        default: dev
        options: [dev, prod]

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    name: terraform plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: true
      AWS_REGION: ${{ vars.AWS_REGION }}
    defaults:
      run:
        working-directory: infra/ecs/terraform_infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Validate Terraform backend config
        run: |
          set -euo pipefail
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "❌ TF_STATE_BUCKET is not set on GitHub Environment '${{ inputs.environment }}'."
            echo "   Settings → Environments → ${{ inputs.environment }} → Environment variables"
            exit 1
          fi
          echo "State bucket: ${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform init
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="envs/backend.partial.hcl" \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -reconfigure

      - name: Terraform fmt check
        continue-on-error: true
        run: terraform fmt -check -recursive

      - name: Terraform plan
        run: |
          set -uo pipefail
          terraform plan \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -input=false \
            -compact-warnings \
            -no-color \
            > plan.log 2>&1
          PLAN_EXIT=$?
          echo "─── Plan summary ───"
          if grep -qE '^(Plan:|No changes\.)' plan.log; then
            grep -E '^(Plan:|No changes\.)' plan.log
          elif grep -q 'Error:' plan.log; then
            echo "Terraform errors:"
            grep 'Error:' plan.log | tail -30
            echo ""
            tail -40 plan.log
          else
            tail -40 plan.log
          fi
          echo ""
          echo "Full plan: plan.log (artifact on this run)."
          exit "$PLAN_EXIT"

      - name: Upload plan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: infra/ecs/terraform_infra/plan.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "### Terraform Plan"
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- State bucket: \`${{ vars.TF_STATE_BUCKET }}\`"
            echo "- Result: ${{ job.status }}"
            echo ""
            echo "To create or update resources, run **Terraform · Apply (ECS infra)** for this environment."
          } >> "$GITHUB_STEP_SUMMARY"
