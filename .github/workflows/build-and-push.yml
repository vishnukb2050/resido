name: Build & Push (ECR)

# Builds Resido service Docker images and pushes them to ECR.
# Wraps infra/ecs/scripts/build-and-push.sh (one job per service, in parallel).
#
# Run standalone (workflow_dispatch) or as the first stage of release.yml
# (workflow_call).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (selects AWS account / region vars)
        type: choice
        required: true
        default: prod
        options: [prod, staging]
      image_tag:
        description: "Image tag (defaults to commit SHA)"
        type: string
        required: false
        default: ""
      services:
        description: 'Services to build: "all" or comma-separated (e.g. auth-service,chat-service)'
        type: string
        required: false
        default: all
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: false
        default: ""
      services:
        type: string
        required: false
        default: all
    outputs:
      image_tag:
        description: The resolved image tag that was built and pushed
        value: ${{ jobs.prepare.outputs.image_tag }}

permissions:
  contents: read

concurrency:
  group: build-push-${{ inputs.environment }}-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      image_tag: ${{ steps.set.outputs.image_tag }}
    steps:
      - name: Compute service matrix and image tag
        id: set
        run: |
          set -euo pipefail
          ALL='["api-gateway","auth-service","resident-service","chat-service","notification-service","visitor-service","flaredthread-service","business-service","media-worker"]'
          svc="${{ inputs.services }}"
          if [ -z "$svc" ] || [ "$svc" = "all" ]; then
            matrix="$ALL"
          else
            matrix="$(echo "$svc" | tr -d ' ' | jq -R -c 'split(",") | map(select(length > 0))')"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_SHA::7}"; fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Services: $matrix"
          echo "Image tag: $tag"

  build:
    name: build ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        run: |
          set -euo pipefail
          chmod +x infra/ecs/scripts/build-and-push.sh
          infra/ecs/scripts/build-and-push.sh "${{ matrix.service }}"

      - name: Summary
        if: always()
        run: |
          echo "- \`${{ matrix.service }}\`:\`${IMAGE_TAG}\` → ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
