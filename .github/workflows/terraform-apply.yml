name: Terraform · Apply (ECS infra)

# Creates or updates AWS infra (VPC, RDS, Redis, ECS, Secrets, etc.).
# Run Terraform Plan first to review changes, then apply when ready.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (matches envs/<env>.tfvars)
        type: choice
        required: true
        default: dev
        options: [dev, prod]
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: terraform apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: true
      AWS_REGION: ${{ vars.AWS_REGION }}
    defaults:
      run:
        working-directory: infra/ecs/terraform_infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Validate Terraform backend config
        run: |
          set -euo pipefail
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "❌ TF_STATE_BUCKET is not set on GitHub Environment '${{ inputs.environment }}'."
            echo "   Settings → Environments → ${{ inputs.environment }} → Environment variables"
            exit 1
          fi
          echo "State bucket: ${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform init
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="envs/backend.partial.hcl" \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -reconfigure

      - name: Terraform fmt check
        continue-on-error: true
        run: terraform fmt -check -recursive

      - name: Terraform plan
        shell: bash
        run: |
          set -uo pipefail
          set +e
          terraform plan \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -input=false \
            -compact-warnings \
            -no-color \
            -out=tfplan \
            > plan.log 2>&1
          PLAN_EXIT=$?
          set -e
          echo "─── Plan summary ───"
          if grep -qE '^(Plan:|No changes\.)' plan.log; then
            grep -E '^(Plan:|No changes\.)' plan.log
          else
            echo "Terraform failed (exit $PLAN_EXIT). Last lines:"
            grep -E '(^Error:|^│ Error:)' plan.log | tail -40 || true
            echo ""
            tail -50 plan.log
          fi
          echo ""
          echo "Full plan: plan.log (artifact on this run)."
          exit "$PLAN_EXIT"

      - name: Upload plan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: infra/ecs/terraform_infra/plan.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Terraform apply
        if: success()
        run: terraform apply -input=false -auto-approve tfplan

      - name: Print CI env exports
        run: |
          echo "─── ci_env_exports (copy to local shell or GitHub vars) ───"
          terraform output -raw ci_env_exports || true
          echo ""
          echo "─── secrets still using REPLACE_ME placeholders ───"
          terraform output -json secrets_requiring_manual_update 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Terraform Apply"
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- State bucket: \`${{ vars.TF_STATE_BUCKET }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
