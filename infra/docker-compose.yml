services:
  # ─── Microservices ─────────────────────────────────────────────
  # Note: Infrastructure (Postgres/Redis) is managed externally (AWS RDS/ElastiCache)
  # Connection details are fetched via .env file.

  api-gateway:
    build:
      context: ../apps/api-gateway
      dockerfile: Dockerfile
    container_name: resido-api-gateway
    env_file: .env
    ports:
      - '3000:3000'
    networks:
      - resido-net
    restart: unless-stopped

  auth-service:
    build:
      context: ../apps/auth-service
      dockerfile: Dockerfile
    container_name: resido-auth
    env_file: .env
    ports:
      - '3001:3001'
    networks:
      - resido-net
    restart: unless-stopped

  resident-service:
    build:
      context: ../apps/resident-service
      dockerfile: Dockerfile
    container_name: resido-resident
    env_file: .env
    ports:
      - '3002:3002'
    networks:
      - resido-net
    restart: unless-stopped

  accounting-service:
    build:
      context: ../apps/accounting-service
      dockerfile: Dockerfile
    container_name: resido-accounting
    env_file: .env
    ports:
      - '3003:3003'
    networks:
      - resido-net
    restart: unless-stopped

  chat-service:
    build:
      context: ../apps/chat-service
      dockerfile: Dockerfile
    container_name: resido-chat
    env_file: .env
    ports:
      - '3004:3004'
    networks:
      - resido-net
    restart: unless-stopped

  notification-service:
    build:
      context: ../apps/notification-service
      dockerfile: Dockerfile
    container_name: resido-notification
    env_file: .env
    ports:
      - '3005:3005'
    networks:
      - resido-net
    restart: unless-stopped

  complaint-service:
    build:
      context: ../apps/complaint-service
      dockerfile: Dockerfile
    container_name: resido-complaint
    env_file: .env
    ports:
      - '3006:3006'
    networks:
      - resido-net
    restart: unless-stopped

  visitor-service:
    build:
      context: ../apps/visitor-service
      dockerfile: Dockerfile
    container_name: resido-visitor
    env_file: .env
    ports:
      - '3007:3007'
    networks:
      - resido-net
    restart: unless-stopped

  flaredthread-service:
    build:
      context: ../apps/flaredthread-service
      dockerfile: Dockerfile
    container_name: resido-flaredthread
    env_file: .env
    ports:
      - '3008:3008'
    networks:
      - resido-net
    restart: unless-stopped

  business-service:
    build:
      context: ../apps/business-service
      dockerfile: Dockerfile
    container_name: resido-business
    env_file: .env
    ports:
      - '3009:3009'
    networks:
      - resido-net
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: resido-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - resido-net
    restart: unless-stopped

  admin-panel:
    build:
      context: ../web/admin
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: resido-admin
    networks:
      - resido-net
    depends_on:
      - api-gateway
    restart: unless-stopped

  superadmin-panel:
    build:
      context: ../web/superadmin
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: resido-superadmin
    networks:
      - resido-net
    depends_on:
      - api-gateway
    restart: unless-stopped

networks:
  resido-net:
    driver: bridge
