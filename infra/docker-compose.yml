services:
  # ─── Microservices ─────────────────────────────────────────────
  # Note: PostgreSQL is managed externally (AWS RDS)
  # Connection details are fetched via .env file.

  api-gateway:
    build:
      context: ../apps/api-gateway
      dockerfile: Dockerfile
    container_name: resido-api-gateway
    env_file: .env
    ports:
      - '3000:3000'
    networks:
      - resido-net
    restart: unless-stopped

  # resident-service owns the `resido_core` Prisma schema and runs
  # `prisma db push` on every startup. Every other service that reads/writes
  # `resido_core` (auth, business, chat, complaint, visitor, accounting,
  # flaredthread) depends on this container so docker starts it FIRST, giving
  # it a head start to push the schema before its consumers wake up.
  resident-service:
    build:
      context: ../apps/resident-service
      dockerfile: Dockerfile
    container_name: resido-resident
    env_file: .env
    ports:
      - '3002:3002'
    environment:
      - PORT=3002
    networks:
      - resido-net
    restart: unless-stopped

  auth-service:
    build:
      context: ../apps/auth-service
      dockerfile: Dockerfile
    container_name: resido-auth
    env_file: .env
    ports:
      - '3001:3001'
    environment:
      - MEDIA_WORKER_SECRET=${MEDIA_WORKER_SECRET:-resido-media-dev-secret}
    volumes:
      # Raw-SQL indexes (GIN / PostGIS GIST / trigram / partial). Applied
      # by start.sh after `prisma db push` and `enable-postgis.js`.
      - ./db-indexes:/app/db-indexes:ro
    depends_on:
      - resident-service
    networks:
      - resido-net
    restart: unless-stopped

  accounting-service:
    build:
      context: ../apps/accounting-service
      dockerfile: Dockerfile
    container_name: resido-accounting
    env_file: .env
    ports:
      - '3003:3003'
    environment:
      - PORT=3003
    depends_on:
      - resident-service
    networks:
      - resido-net
    restart: unless-stopped

  chat-service:
    build:
      context: ../apps/chat-service
      dockerfile: Dockerfile
    container_name: resido-chat
    env_file: .env
    ports:
      - '3004:3004'
    environment:
      - PORT=3004
    depends_on:
      - resident-service
    networks:
      - resido-net
    restart: unless-stopped

  notification-service:
    build:
      context: ../apps/notification-service
      dockerfile: Dockerfile
    container_name: resido-notification
    env_file: .env
    ports:
      - '3005:3005'
    environment:
      - PORT=3005
    networks:
      - resido-net
    restart: unless-stopped

  complaint-service:
    build:
      context: ../apps/complaint-service
      dockerfile: Dockerfile
    container_name: resido-complaint
    env_file: .env
    ports:
      - '3007:3007'
    environment:
      - PORT=3007
    depends_on:
      - resident-service
    networks:
      - resido-net
    restart: unless-stopped

  visitor-service:
    build:
      context: ../apps/visitor-service
      dockerfile: Dockerfile
    container_name: resido-visitor
    env_file: .env
    ports:
      - '3006:3006'
    environment:
      - PORT=3006
    depends_on:
      - resident-service
    networks:
      - resido-net
    restart: unless-stopped

  flaredthread-service:
    build:
      context: ../apps/flaredthread-service
      dockerfile: Dockerfile
    container_name: resido-flaredthread
    env_file: .env
    ports:
      - '3008:3008'
    environment:
      - MEDIA_WORKER_SECRET=${MEDIA_WORKER_SECRET:-resido-media-dev-secret}
    depends_on:
      - resident-service
    networks:
      - resido-net
    restart: unless-stopped

  media-worker:
    build:
      context: ../apps/media-worker
      dockerfile: Dockerfile
    container_name: resido-media-worker
    env_file: .env
    environment:
      - FLAREDTHREAD_URL=http://flaredthread-service:3008
      - AUTH_SERVICE_URL=http://auth-service:3001
      - MEDIA_WORKER_SECRET=${MEDIA_WORKER_SECRET:-resido-media-dev-secret}
    depends_on:
      - flaredthread-service
      - auth-service
    networks:
      - resido-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  business-service:
    build:
      context: ../apps/business-service
      dockerfile: Dockerfile
    container_name: resido-business
    env_file: .env
    ports:
      - '3009:3009'
    depends_on:
      - resident-service
    networks:
      - resido-net
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: resido-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - resido-net
    restart: unless-stopped

  admin-panel:
    build:
      context: ../web/admin
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: resido-admin
    networks:
      - resido-net
    depends_on:
      - api-gateway
    restart: unless-stopped

  superadmin-panel:
    build:
      context: ../web/superadmin
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: resido-superadmin
    networks:
      - resido-net
    depends_on:
      - api-gateway
    restart: unless-stopped

networks:
  resido-net:
    driver: bridge
