services:
  # ─── Microservices ─────────────────────────────────────────────
  # Note: Infrastructure (Postgres/Redis) is managed externally (AWS RDS/ElastiCache)
  # Connection details are fetched via .env file.

  api-gateway:
    build:
      context: ../apps/api-gateway
      dockerfile: Dockerfile
    container_name: resido-api-gateway
    env_file: ../.env
    ports:
      - '3000:3000'
    networks:
      - resido-net
    restart: unless-stopped

  auth-service:
    build:
      context: ../apps/auth-service
      dockerfile: Dockerfile
    container_name: resido-auth
    env_file: ../.env
    environment:
      - PORT=3001
      - MASTER_WRITE_URL=${MASTER_WRITE_URL}
      - MASTER_READ_URL=${MASTER_READ_URL}
      - USER_WRITE_URL=${USER_WRITE_URL}
      - USER_READ_URL=${USER_READ_URL}
    command: >
      sh -c "echo 'Checking DB...' && 
             npx prisma db push --schema=prisma/master/schema.prisma --accept-data-loss && 
             npx prisma db push --schema=prisma/user/schema.prisma --accept-data-loss && 
             node dist/main"
    networks:
      - resido-net
    restart: unless-stopped

  resident-service:
    build:
      context: ../apps/resident-service
      dockerfile: Dockerfile
    container_name: resido-resident
    env_file: ../.env
    environment:
      - PORT=3002
      - CORE_WRITE_URL=${CORE_WRITE_URL}
      - CORE_READ_URL=${CORE_READ_URL}
    command: sh -c "echo 'Syncing DB...' && npx prisma db push --accept-data-loss && node dist/main"
    networks:
      - resido-net
    restart: unless-stopped

  accounting-service:
    build:
      context: ../apps/accounting-service
      dockerfile: Dockerfile
    container_name: resido-accounting
    env_file: ../.env
    environment:
      - PORT=3003
    networks:
      - resido-net
    restart: unless-stopped

  chat-service:
    build:
      context: ../apps/chat-service
      dockerfile: Dockerfile
    container_name: resido-chat
    env_file: ../.env
    environment:
      - PORT=3004
    command: sh -c "npx prisma db push --accept-data-loss && node dist/main"
    ports:
      - '3004:3004'
    networks:
      - resido-net
    restart: unless-stopped

  notification-service:
    build:
      context: ../apps/notification-service
      dockerfile: Dockerfile
    container_name: resido-notification
    env_file: ../.env
    environment:
      - PORT=3005
    networks:
      - resido-net
    restart: unless-stopped

  visitor-service:
    build:
      context: ../apps/visitor-service
      dockerfile: Dockerfile
    container_name: resido-visitor
    env_file: ../.env
    environment:
      - PORT=3006
    command: sh -c "npx prisma db push --accept-data-loss && node dist/main"
    networks:
      - resido-net
    restart: unless-stopped

  complaint-service:
    build:
      context: ../apps/complaint-service
      dockerfile: Dockerfile
    container_name: resido-complaint
    env_file: ../.env
    environment:
      - PORT=3007
    command: sh -c "npx prisma db push --accept-data-loss && node dist/main"
    networks:
      - resido-net
    restart: unless-stopped

  blog-service:
    build:
      context: ../apps/blog-service
      dockerfile: Dockerfile
    container_name: resido-blog
    env_file: ../.env
    environment:
      - PORT=3008
      - CORE_WRITE_URL=${CORE_WRITE_URL}
      - CORE_READ_URL=${CORE_READ_URL}
    command: sh -c "echo 'Syncing DB...' && npx prisma db push --accept-data-loss && node dist/main"
    networks:
      - resido-net
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: resido-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - resido-net
    restart: unless-stopped

  admin-panel:
    build:
      context: ../web/admin
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: resido-admin
    networks:
      - resido-net
    depends_on:
      - api-gateway
    restart: unless-stopped

  superadmin-panel:
    build:
      context: ../web/superadmin
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: resido-superadmin
    networks:
      - resido-net
    depends_on:
      - api-gateway
    restart: unless-stopped

networks:
  resido-net:
    driver: bridge
