worker_processes 1;
events { }

http {
  upstream api_gateway {
    server api-gateway:3000;
  }
  upstream admin_panel {
    server admin-panel:80;
  }
  upstream superadmin_panel {
    server superadmin-panel:80;
  }
  upstream chat_service {
    server chat-service:3004;
  }

  # SuperAdmin Routing
  server {
    listen 80;
    server_name superadmin.residoapp.com;

    location / {
      proxy_pass http://superadmin_panel;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://api_gateway/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # Main Admin Routing
  server {
    listen 80;
    server_name residoapp.com www.residoapp.com;

    location / {
      proxy_pass http://admin_panel;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://api_gateway/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
      proxy_pass http://chat_service/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
